<div class="card education">
  <h3>Extracurricular Courses</h3>
  <div class="edu-list">
    @for (c of courses; track $index) {
      <div class="edu-item">
        <div class="title">{{ c.title }}</div>
        <div class="small">{{ c.date }} — {{ c.institution }}</div>
        <div class="credential">Credencial: {{ c.credential }}</div>
      </div>
    }
  </div>
</div>
