<div class="card experience">
  @for (j of jobs; track $index) {
    <div
      class="job"
      [class.expanded]="j.expanded"
      (click)="toggleExpand(j)"
    >
      <div class="logo"><img [src]="j.logo" alt="logo"></div>
      <div class="meta">
        <div class="role">{{ j.role }}</div>
        <div class="company">{{ j.company }}</div>
      </div>
      <div class="date small">
        {{ j.from }}{{ j.to ? (' - ' + j.to) : '' }}
      </div>

      <!-- Contenido expandido -->
      @if (j.expanded) {
        <div class="details">
          <div class="cycle"><strong>Ciclo:</strong> {{ j.cycle }}</div>
          <div class="course"><strong>Curso:</strong> {{ j.course }}</div>
          <div class="description">{{ j.description }}</div>
        </div>
      }
    </div>
  }
</div>
