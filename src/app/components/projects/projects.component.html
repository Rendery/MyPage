<div class="glass-card projects-container">
  <h2 class="font-title header-title">Latest Projects</h2>
  
  <div class="project-grid">
    @for (p of projects; track $index) {
      <a [href]="p.link" target="_blank" class="project-card">
        <div class="icon">{{ p.icon }}</div>
        <div class="p-content">
          <div class="p-title">{{ p.title }}</div>
          <div class="p-desc text-muted">{{ p.desc }}</div>
        </div>
        <div class="arrow">↗</div>
      </a>
    }
  </div>
</div>
