@let t = i18n.c().ui.contact;
<section id="contacto" class="section contact">
  <div class="wrap contact-grid">
    <div class="contact-copy">
      <p class="eyebrow" appReveal="fade">{{ mode.simple() ? '07' : '08' }} · <b>{{ t.eyebrow }}</b></p>
      <h2 class="contact-title" [appSplit]="t.titleA + ' <em>' + t.titleB + '</em>'"></h2>
      <p class="section-lead" appReveal>{{ t.lead }}</p>

      <div class="channels" appReveal="stagger">
        <button type="button" class="channel" (click)="copyEmail()" [attr.data-cursor]="t.cursor">
          <span class="ch-ico" aria-hidden="true">✉</span>
          <span><small class="mono">{{ t.mail }}</small><b>{{ profile.email }}</b></span>
        </button>
        <a class="channel" [href]="profile.linkedin" target="_blank" rel="noopener">
          <span class="ch-ico" aria-hidden="true">in</span>
          <span><small class="mono">LinkedIn</small><b>Edery Abanto</b></span>
        </a>
        <a class="channel" [href]="profile.github" target="_blank" rel="noopener">
          <span class="ch-ico" aria-hidden="true">⌥</span>
          <span><small class="mono">GitHub</small><b>EderyRAV</b></span>
        </a>
        <a class="channel" [href]="profile.whatsapp" target="_blank" rel="noopener">
          <span class="ch-ico wa" aria-hidden="true">✆</span>
          <span><small class="mono">WhatsApp</small><b>{{ profile.phone }}</b></span>
        </a>
      </div>

      <a class="btn primary cv" [href]="profile.cv" download appMagnetic>{{ t.cv }} <span aria-hidden="true">↓</span></a>
    </div>

    <div class="contact-side">
      <app-avatar class="contact-avatar" pose="celebrate" [alt]="i18n.c().ui.hero.avatarAlt" />

      <form class="quick card" (submit)="$event.preventDefault(); send()" appReveal>
        <p class="quick-title">{{ t.quick }}</p>
        <div class="row">
          <label>
            <span class="mono">{{ t.name }}</span>
            <input #n type="text" autocomplete="name" [value]="name()" (input)="name.set(n.value)" />
          </label>
          <label>
            <span class="mono">{{ t.company }}</span>
            <input #co type="text" autocomplete="organization" [value]="company()" (input)="company.set(co.value)" />
          </label>
        </div>
        <label>
          <span class="mono">{{ t.message }}</span>
          <textarea #m rows="3" [placeholder]="t.messagePh" [value]="message()" (input)="message.set(m.value)"></textarea>
        </label>
        <button type="submit" class="btn primary" appMagnetic>{{ t.send }} <span aria-hidden="true">→</span></button>
        <p class="hint mono">{{ t.hint }}</p>
      </form>
    </div>
  </div>

  <footer class="footer wrap">
    <div class="foot-big" aria-hidden="true">EDERY ABANTO</div>
    <div class="foot-row">
      <p class="mono">{{ t.footer(year) }}</p>
      <p class="mono easter">{{ t.easterA }} <kbd>Ctrl</kbd> + <kbd>K</kbd> · {{ t.easterB }}</p>
      <button type="button" class="to-top mono" (click)="top()">{{ t.top }}</button>
    </div>
  </footer>
</section>
